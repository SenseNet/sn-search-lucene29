name: Docker image - SearchService

on:
  push:
    branches:
      - develop
      - master
    paths:
      - src/**
      - .github/workflows/docker-image.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - master
    paths:
      - src/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the image to Docker Hub.
        required: false
        default: false
        type: boolean
      custom_tag:
        description: Optional extra tag for a manual publication.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docker-searchservice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build SearchService image
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build inputs
        shell: bash
        env:
          BUILD_CONTEXT: ./src
          DOCKERFILE: ./src/SenseNet.Search.Lucene29.Centralized.GrpcService/Dockerfile
        run: |
          set -euo pipefail

          test -d "${BUILD_CONTEXT}" || {
            echo "::error::Docker context does not exist: ${BUILD_CONTEXT}"
            exit 1
          }
          test -f "${DOCKERFILE}" || {
            echo "::error::Dockerfile does not exist: ${DOCKERFILE}"
            exit 1
          }

      - name: Resolve source version
        id: source
        shell: bash
        env:
          BRANCH_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          COMMIT_DATE="$(git show -s --format=%cd --date=format:%Y%m%d HEAD)"
          VERSION_TAG="${COMMIT_DATE}-${SHORT_SHA}"
          LEGACY_DATE="$(TZ=Europe/Budapest date +%Y.%m.%d)"

          case "${BRANCH_TAG}" in
            main|master)
              COMPATIBILITY_TAG="${LEGACY_DATE}"
              ;;
            *)
              COMPATIBILITY_TAG="${BRANCH_TAG}.${LEGACY_DATE}"
              ;;
          esac

          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "branch_tag=${BRANCH_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"
          echo "compatibility_tag=${COMPATIBILITY_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: sensenetcsp/sn-searchservice
          tags: |
            type=raw,value=${{ steps.source.outputs.branch_tag }}
            type=raw,value=${{ steps.source.outputs.compatibility_tag }}
            type=raw,value=${{ steps.source.outputs.version_tag }}
            type=raw,value=preview,enable=${{ github.event_name == 'push' && github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/SenseNet.Search.Lucene29.Centralized.GrpcService/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=searchservice
          cache-to: type=gha,mode=max,scope=searchservice
